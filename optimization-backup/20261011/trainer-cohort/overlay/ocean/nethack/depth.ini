# Depth recipe used for the archived 2B runs and subsequent 4B retrain.
# Challenge multi-role, SEARCH20 and RUN masked.
# Use: copy over config/nethack.ini, then ./build.sh nethack && ./puffer train
[base]
env_name = nethack
reset_every_horizon = 0
async = 1

[vec]
total_agents = 256
num_buffers = 4
num_threads = 24

[env]
gold_coef = 0.0953414813
exp_coef = 9.99999975e-05
descent_coef = 0.807671428
floor_coef = 0.463313729
xp_coef = 0.0555660129
scout_coef = 0.0192291923
death_penalty = -0.580139101
mask_search20 = 1
mask_run = 1
multi_role = 1
score_coef = 0

[policy]
hidden_size = 512
num_layers = 3

[train]
total_timesteps = 2000000000
minibatch_size = 4096
horizon = 256
learning_rate = 0.000608655275
momentum = 0.984448254
verb_eps = 0.005
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0
gamma = 0.998621047
gae_lambda = 0.536597371
replay_ratio = 1.91373289
clip_coef = 0.175347924
vf_coef = 1.45746601
vf_clip_coef = 0.00999999978
max_grad_norm = 1.23201728
ent_coef = 0.00844300818
anneal_lr = 1
anneal_ent_coef = 0
min_lr_ratio = 0.0
min_ent_coef_ratio = 0.1
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
vtrace = 0
gpus = 1

[sweep]
metric = max_depth
