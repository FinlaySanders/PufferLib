[base]
env_name = drone

[vec]
total_agents = 2048
num_buffers = 8
num_threads = 1

[env]
num_drones = 64

# multi-task step fractions
hover_frac = 1.0
race_frac = 0.0
sphere_frac = 0.0
cube_frac = 0.0
flag_frac = 0.0

# shared
alpha_dist = 0.0  # redundant with hover k_dist; only mattered for race

# hover
sphere_radius = 4.0
k_dist = 1.0
k_vel = 0.1
k_omega = 0.1
hover_alpha_action = 0.01
hover_target_dist = 5
hover_horizon = 1024

# race
max_rings = 10
ring_reward = 1.0
race_alpha_omega = 0.0001
race_horizon = 2048

[policy]
expansion_factor = 1
hidden_size = 64
num_layers = 1

[train]
anneal_lr = 1
beta1 = 0.9605091218915885
beta2 = 0.9975342514897555
clip_coef = 0.2792041834527874
ent_coef = 0.009614464430623536
eps = 3.890998066747521e-12
gae_lambda = 0.8397140951280606
gamma = 0.9827341882497986
gpus = 1
horizon = 64
learning_rate = 0.0036073110182039277
max_grad_norm = 0.1
min_lr_ratio = 0
minibatch_size = 4096
prio_alpha = 0.5664372304116252
prio_beta0 = 1
replay_ratio = 2.321476115575771
seed = 42
total_timesteps = 46_000_000
vf_clip_coef = 5
vf_coef = 5
vtrace_c_clip = 5
vtrace_rho_clip = 3.2646604263658587

[sweep]
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
mean = 8e7
scale = auto

